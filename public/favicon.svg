<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- Background circular gradient border -->
  <rect width="100" height="100" rx="20" fill="#05050A" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#grad)" stroke-width="5" />
  
  <!-- Left bracket < -->
  <path d="M28 35 L14 50 L28 65" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right bracket > -->
  <path d="M72 35 L86 50 L72 65" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Stylized human/brain inside a glowing code style -->
  <!-- A human head profile facing right, constructed of horizontal "code lines" of varying lengths -->
  <g fill="#ffffff">
    <rect x="42" y="26" width="16" height="4.5" rx="2.25" />
    <rect x="38" y="34" width="22" height="4.5" rx="2.25" />
    <rect x="36" y="42" width="24" height="4.5" rx="2.25" />
    <rect x="36" y="50" width="28" height="4.5" rx="2.25" /> <!-- nose extends here -->
    <rect x="38" y="58" width="20" height="4.5" rx="2.25" /> <!-- lips/chin indent -->
    <rect x="40" y="66" width="22" height="4.5" rx="2.25" /> <!-- chin extends -->
    <rect x="44" y="74" width="12" height="4.5" rx="2.25" /> <!-- neck -->
  </g>
</svg>